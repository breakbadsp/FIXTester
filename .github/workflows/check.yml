name: Check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run KaizenFlow checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '120' || '' }}
        run: |
          selector="$RUNNER_TEMP/kaizen-checks.sh"
          curl --fail --silent --show-error --location --retry 3 --output "$selector" \
            https://raw.githubusercontent.com/breakbadsp/ai-assets/63ba2b3eb7ac66348ebcfab6bc31f1bf500853af/scripts/kaizen-checks.sh
          printf '%s  %s\n' 41f864ba12131bf78b51c83e9387244cc2ca966ede690cbfb3e672e1374ea33f "$selector" |
            sha256sum --check --status
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            bash "$selector" --base "$BASE_SHA"
          else
            bash "$selector" --base HEAD --all
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wire-fuzz-failures
          path: fuzz/artifacts/wire/
          if-no-files-found: ignore
