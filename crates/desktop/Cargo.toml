[package]
name = "fixtester-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
  "accesskit",
  "clipboard",
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }
fix-codec = { path = "../fix-codec" }
fix-dict = { path = "../fix-dict" }
fix-session = { path = "../fix-session" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
thiserror = "2"

tempfile = "3"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "fixtester"
path = "src/main.rs"
